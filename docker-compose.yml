    backend:
        build:
            context: ./back-end/fast-api
        container_name: backend
        env_file:
            - ./back-end/fast-api/.env
        ports:
            - "8000:8000"
        volumes:
            - ./back-end/fast-api:/code
        depends_on:
            mysql:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
            # vllm:
            #     condition: service_healthy
        network_mode: host
        ipc: host
        dns:
            - 192.168.1.15
            - 1.1.1.1

    frontend:
        build:
            context: ./front-end/next-js
            dockerfile: Dockerfile
            args:
                NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://api.ganisalchperera.com}
        container_name: frontend
        ports:
            - "3000:3000"
        env_file:
            - ./front-end/next-js/.env
        depends_on:
            backend:
                condition: service_started
        network_mode: host
        ipc: host
        dns:
            - 192.168.1.15
            - 1.1.1.1

volumes:
    mysql_data:
