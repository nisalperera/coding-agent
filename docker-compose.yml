    postgresql:
        image: postgres:13
        container_name: postgresql
        restart: unless-stopped

        env_file:
            - ./database/postgresql/.env

        volumes:
            - ./database/postgresql/data:/var/lib/postgresql/data
        healthcheck:
            test:
            - CMD-SHELL
            - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s
        network_mode: host
        ipc: host
        dns:
            - 192.168.1.15
            - 1.1.1.1
    mongodb:
        image: mongo:latest
        container_name: mongodb
        restart: always
        ports:
            - "27017:27017"
        env_file:
            - ./database/mongodb/.env
        volumes:
            - ./database/mongodb/data:/data/db
        healthcheck:
            test: 
                - "CMD-SHELL"
                - "mongosh --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.runCommand({ping:1})' --quiet"
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s
        network_mode: host
        ipc: host
        dns:
            - 192.168.1.15
            - 1.1.1.1

    migrate:
        build:
            context: ./coding-agent-back-end/fast-api
        env_file:
            - ./coding-agent-back-end/fast-api/.env
        command: [ "alembic", "upgrade", "head" ]
        depends_on:
            postgresql:
                condition: service_healthy
        restart: "no"
        network_mode: host
        ipc: host
        dns:
            - 192.168.1.15
            - 1.1.1.1

    vllm:
        build:
            context: ./vllm-model
            args:
                - MODEL_NAME=Qwen/Qwen3-8B-AWQ
                - MODEL_FILE=
        image: coding-agent-vllm:local
        container_name: vllm
        restart: unless-stopped
        network_mode: host
        ipc: host
        env_file:
            - ./vllm-model/.env
        volumes:
            - /home/nisalperera/Projects/personal/models/huggingface:/root/.cache/huggingface
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [ gpu ]
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                  python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=5)"
            interval: 15s
            timeout: 10s
            retries: 40
            start_period: 300s
        dns:
            - 192.168.1.15
            - 1.1.1.1

    vllm-embed:
        build:
            context: ./vllm-embed-model
            args:
                - MODEL_NAME=Qwen/Qwen3-Embedding-0.6B
                - MODEL_FILE=
        image: embed-agent-vllm:local
        container_name: vllm-embed
        restart: unless-stopped
        network_mode: host
        ipc: host
        env_file:
            - ./vllm-embed-model/.env
        volumes:
            - /home/nisalperera/Projects/personal/models/huggingface:/root/.cache/huggingface
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [ gpu ]
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                  python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/health', timeout=5)"
            interval: 15s
            timeout: 10s
            retries: 40
            start_period: 300s
        dns:
            - 192.168.1.15
            - 1.1.1.1

    backend:
        build:
            context: ./coding-agent-back-end/fast-api
        container_name: backend
        env_file:
            - ./coding-agent-back-end/fast-api/.env
        ports:
            - "8000:8000"
        volumes:
            - ./coding-agent-back-end/fast-api:/code
        depends_on:
            postgresql:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
            mongodb:
                condition: service_healthy
            # vllm:
            #     condition: service_healthy
        network_mode: host
        ipc: host
        dns:
            - 192.168.1.15
            - 1.1.1.1

    frontend:
        build:
            context: ./coding-agent-front-end/next-js
            dockerfile: Dockerfile
            args:
                NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://api.nisalchperera.com}
        container_name: frontend
        ports:
            - "3000:3000"
        env_file:
            - ./coding-agent-front-end/next-js/.env
        depends_on:
            backend:
                condition: service_started
        network_mode: host
        ipc: host
        dns:
            - 192.168.1.15
            - 1.1.1.1
