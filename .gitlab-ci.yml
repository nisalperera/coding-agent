stages:
  - test
  - deploy

variables:
  AWS_REGION: "us-east-1"
  STACK_NAME: "coding-agent-stack"

test:
  stage: test
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - pip install -r requirements.txt
    - pip install pytest flake8
    - flake8 lambda_function.py cli_agent.py cli_auth.py repo_tools.py --max-line-length=120 --extend-ignore=E203
    - if [ -d tests ]; then pytest tests/ -v; else echo "No tests directory found, skipping"; fi

fastapi-test:
  stage: test
  image: python:3.12-slim
  variables:
    D0_TEST_SANDBOX: "1"
    TEST_DATABASE_URL: postgresql+psycopg://coding_agent_test:d0-test-only-password@postgres-test:5432/coding_agent_test
    TEST_MONGODB_URI: mongodb://mongo-test:27017/
    TEST_MONGODB_DATABASE: coding_agent_test
    POSTGRES_DB: coding_agent_test
    POSTGRES_USER: coding_agent_test
    POSTGRES_PASSWORD: d0-test-only-password
  services:
    - name: postgres:13
      alias: postgres-test
    - name: mongo:8.0
      alias: mongo-test
  rules:
    - changes:
        - back-end/fast-api/**
        - .github/workflows/fastapi-tests.yml
        - .gitlab-ci.yml
  before_script:
    - cd back-end/fast-api
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt -r requirements-dev.txt
  script:
    - python -m unittest discover -s tests_support -p 'test_*.py' -v
    - python -m tests_support.run_backend_suite

deploy:
  stage: deploy
  image: python:3.12-slim
  needs:
    - test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  id_tokens:
    AWS_ID_TOKEN:
      aud: https://gitlab.com
  before_script:
    - pip install aws-sam-cli
    - apt-get update && apt-get install -y curl unzip jq
    - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
    - unzip -q awscliv2.zip
    - ./aws/install
    - >
      export $(aws sts assume-role-with-web-identity
      --role-arn $AWS_DEPLOY_ROLE_ARN
      --role-session-name gitlab-ci-deploy
      --web-identity-token $AWS_ID_TOKEN
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text | awk '{print "AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" AWS_SESSION_TOKEN="$3}')
  script:
    - export AWS_DEFAULT_REGION=$AWS_REGION
    - sam build --use-container
    - >
      sam deploy
      --stack-name $STACK_NAME
      --capabilities CAPABILITY_IAM
      --region $AWS_REGION
      --no-confirm-changeset
      --no-fail-on-empty-changeset
      --resolve-s3
      --parameter-overrides
      VllmEndpoint=$VLLM_ENDPOINT
      UserPoolId=$COGNITO_USER_POOL_ID
      TavilyApiKey=$TAVILY_API_KEY
      SubnetId=$VPC_SUBNET_ID
      SecurityGroupId=$VPC_SECURITY_GROUP_ID
      Ec2InstanceId=$EC2_INSTANCE_ID
      GitHubToken=$GITHUB_TOKEN
      GitLabToken=$GITLAB_TOKEN
      GitHubOAuthClientId=$GITHUB_OAUTH_CLIENT_ID
      GitHubOAuthClientSecret=$GITHUB_OAUTH_CLIENT_SECRET
      DomainName=$FRONTEND_DOMAIN_NAME
      HostedZoneId=$FRONTEND_HOSTED_ZONE_ID
    - >
      aws cloudformation describe-stacks
      --stack-name $STACK_NAME
      --query "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue"
      --output text

deploy-frontend:
  stage: deploy
  image: python:3.12-slim
  needs:
    - deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  id_tokens:
    AWS_ID_TOKEN:
      aud: https://gitlab.com
  before_script:
    - apt-get update && apt-get install -y curl unzip jq
    - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
    - unzip -q awscliv2.zip
    - ./aws/install
    - >
      export $(aws sts assume-role-with-web-identity
      --role-arn $AWS_DEPLOY_ROLE_ARN
      --role-session-name gitlab-ci-deploy-frontend
      --web-identity-token $AWS_ID_TOKEN
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text | awk '{print "AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" AWS_SESSION_TOKEN="$3}')
  script:
    - export AWS_DEFAULT_REGION=$AWS_REGION
    - >
      FUNCTION_URL=$(aws cloudformation describe-stacks
      --stack-name $STACK_NAME
      --query "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue"
      --output text)
    - >
      BUCKET_NAME=$(aws cloudformation describe-stacks
      --stack-name $STACK_NAME
      --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue"
      --output text)
    - >
      DISTRIBUTION_ID=$(aws cloudformation describe-stacks
      --stack-name $STACK_NAME
      --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue"
      --output text)
    - sed -i "s|__LAMBDA_FUNCTION_URL__|$FUNCTION_URL|g" front-end/config.js
    - sed -i "s|__COGNITO_DOMAIN__|$COGNITO_DOMAIN|g" front-end/config.js
    - sed -i "s|__COGNITO_CLIENT_ID__|$COGNITO_CLIENT_ID|g" front-end/config.js
    - sed -i "s|__GITHUB_OAUTH_CLIENT_ID__|$GITHUB_OAUTH_CLIENT_ID|g" front-end/config.js
    - sed -i "s|__GITLAB_OAUTH_CLIENT_ID__|$GITLAB_OAUTH_CLIENT_ID|g" front-end/config.js
    - aws s3 sync front-end/ s3://$BUCKET_NAME/ --delete
    - aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"


frontend-acceptance:
  stage: test
  image: node:22.22.2-bookworm-slim
  timeout: 45m
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  rules:
    - changes:
        - front-end/next-js/**
        - .github/workflows/frontend-acceptance.yml
        - .gitlab-ci.yml
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends docker.io ca-certificates
  script:
    - node front-end/next-js/scripts/run-frontend-acceptance.mjs --container --output output/frontend-acceptance
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - output/frontend-acceptance/
