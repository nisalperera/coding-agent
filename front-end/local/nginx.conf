# front-end/nginx.conf
#
# Static SPA server block. try_files falls back to /index.html so
# client-side-only routes (/callback/github, /callback/gitlab) resolve
# correctly instead of 404ing on a direct navigation or page refresh.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ES modules must be served with a JS MIME type for <script type="module">.
    location ~* \.js$ {
        add_header Content-Type application/javascript;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
