<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nisal's Coding Agent</title>
<meta name="description" content="Agentic coding assistant with repo-aware tools and RAG-backed answers." />

<!-- Tailwind CSS (utility framework, no build step required) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand: {
            50: '#eef2ff', 100:'#e0e7ff', 200:'#c7d2fe', 300:'#a5b4fc',
            400:'#818cf8', 500:'#6366f1', 600:'#4f46e5', 700:'#4338ca',
            800:'#3730a3', 900:'#312e81'
          }
        }
      }
    }
  };
</script>

<!-- Markdown + syntax highlighting for assistant responses (code-focused agent) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>

<style>
  html, body { height: 100%; }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: rgba(100,100,100,.35); border-radius: 8px; }
  .msg-enter { animation: fadeSlideIn .25s ease-out; }
  @keyframes fadeSlideIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
  #input { field-sizing: content; }
  .typing-dot { animation: blink 1.2s infinite ease-in-out; }
  .typing-dot:nth-child(2){ animation-delay:.2s; }
  .typing-dot:nth-child(3){ animation-delay:.4s; }
  @keyframes blink { 0%,80%,100%{ opacity:.2 } 40%{ opacity:1 } }
  .prose-chat pre { border-radius: .5rem; }
  .prose-chat code { word-break: break-word; }
  .file-chip { animation: fadeSlideIn .2s ease-out; }
  #drop-overlay { backdrop-filter: blur(2px); }
</style>
</head>

<body class="h-screen flex flex-col bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors">

  <!-- Header / Auth bar -->
  <header class="shrink-0 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur sticky top-0 z-20">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 min-w-0">
        <div class="h-8 w-8 rounded-lg bg-brand-600 flex items-center justify-center text-white font-bold shrink-0">CA</div>
        <div class="min-w-0">
          <h1 class="text-sm font-semibold leading-tight truncate">Nisal's Coding Agent</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 truncate">Agentic AI &amp; RAG assistant</p>
        </div>
      </div>

      <div id="auth-bar" class="flex items-center gap-2">
        <div id="auth-signed-out" class="flex items-center gap-2">
          <button onclick="loginWithProvider('Google')"
            class="text-xs sm:text-sm px-3 py-1.5 rounded-full border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
            Sign in with Google
          </button>
          <button onclick="loginWithProvider('GitHub')"
            class="text-xs sm:text-sm px-3 py-1.5 rounded-full bg-slate-900 text-white dark:bg-white dark:text-slate-900 hover:opacity-90 transition">
            Sign in with GitHub
          </button>
        </div>
        <div id="auth-signed-in" class="hidden items-center gap-2">
          <span id="user-email" class="hidden sm:inline text-xs text-slate-500 dark:text-slate-400 truncate max-w-[10rem]"></span>
          <button onclick="logout()"
            class="text-xs sm:text-sm px-3 py-1.5 rounded-full border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
            Log out
          </button>
        </div>
        <button onclick="toggleTheme()" aria-label="Toggle theme"
          class="h-8 w-8 shrink-0 rounded-full border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center justify-center text-sm">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Chat log -->
  <main id="chat" class="flex-1 overflow-y-auto relative">
    <div class="max-w-3xl mx-auto px-4 py-6 flex flex-col gap-4">
      <div id="empty-state" class="text-center text-slate-400 dark:text-slate-500 py-16">
        <div class="text-3xl mb-2">🤖</div>
        <p class="text-sm">Ask about your repo, request an edit, paste an error, or attach a file to debug.</p>
      </div>
    </div>
    <div id="drop-overlay" class="hidden absolute inset-0 z-30 bg-brand-600/10 border-2 border-dashed border-brand-500 rounded-lg m-2 items-center justify-center">
      <p class="text-brand-700 dark:text-brand-300 font-medium text-sm sm:text-base">Drop files to attach</p>
    </div>
  </main>

  <!-- Typing indicator -->
  <div id="typing-indicator" class="hidden max-w-3xl mx-auto w-full px-4 pb-1 -mt-2">
    <div class="flex items-center gap-1 text-slate-400 text-sm pl-11">
      <span class="typing-dot h-1.5 w-1.5 rounded-full bg-slate-400 inline-block"></span>
      <span class="typing-dot h-1.5 w-1.5 rounded-full bg-slate-400 inline-block"></span>
      <span class="typing-dot h-1.5 w-1.5 rounded-full bg-slate-400 inline-block"></span>
    </div>
  </div>

  <!-- Composer -->
  <footer class="shrink-0 border-t border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur">
    <div class="max-w-3xl mx-auto px-4 py-3">

      <!-- Attached file chips -->
      <div id="file-chips" class="hidden flex flex-wrap gap-2 mb-2"></div>

      <div class="flex items-end gap-2 rounded-2xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 shadow-sm focus-within:ring-2 focus-within:ring-brand-500">
        <input id="file-input" type="file" multiple class="hidden" onchange="handleFileSelect(this.files)" />
        <button type="button" onclick="document.getElementById('file-input').click()" aria-label="Attach file"
          class="h-9 w-9 shrink-0 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 flex items-center justify-center transition">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.44 11.05 12.25 20.24a5.5 5.5 0 0 1-7.78-7.78l8.49-8.48a3.5 3.5 0 0 1 4.95 4.95l-8.49 8.49a1.5 1.5 0 0 1-2.12-2.12l7.07-7.07"/>
          </svg>
        </button>
        <textarea id="input" rows="1" placeholder="Message the coding agent..."
          class="flex-1 resize-none bg-transparent outline-none text-sm sm:text-base max-h-40 py-1.5"
          oninput="autoResize(this)" onkeydown="handleKeydown(event)"></textarea>
        <button id="send-btn" onclick="send()" aria-label="Send message"
          class="h-9 w-9 shrink-0 rounded-full bg-brand-600 hover:bg-brand-700 disabled:opacity-40 disabled:cursor-not-allowed text-white flex items-center justify-center transition">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-4 w-4 -rotate-90">
            <path d="M3.4 20.6 22 12 3.4 3.4 3 10l13 2-13 2z"/>
          </svg>
        </button>
      </div>
      <p class="text-[11px] text-slate-400 mt-1.5 text-center">Enter to send &middot; Shift+Enter for a new line &middot; Attach files up to 2&nbsp;MB each</p>
    </div>
  </footer>

<script>
  // ---- Runtime configuration -------------------------------------------
  // These placeholders are substituted at deploy time by CI (see
  // .github/workflows/deploy.yml and .gitlab-ci.yml) using the live
  // CloudFormation stack outputs and pipeline secrets. Do not hardcode
  // real values here.
  const LAMBDA_URL = "__LAMBDA_FUNCTION_URL__";
  const COGNITO_DOMAIN = "__COGNITO_DOMAIN__";
  const CLIENT_ID = "__COGNITO_CLIENT_ID__";
  const REDIRECT_URI = window.location.origin + "/callback";

  const MAX_FILE_BYTES = 2 * 1024 * 1024; // 2 MB per file, adjust to match backend/API Gateway payload limits
  let history = [];
  let attachments = []; // [{ name, size, content }]

  // ---- Theme -------------------------------------------------------------
  function applyTheme(dark) {
    document.documentElement.classList.toggle('dark', dark);
    document.getElementById('theme-icon').textContent = dark ? '☀️' : '🌙';
    localStorage.setItem('theme', dark ? 'dark' : 'light');
  }
  function toggleTheme() {
    applyTheme(!document.documentElement.classList.contains('dark'));
  }
  (function initTheme() {
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(saved ? saved === 'dark' : prefersDark);
  })();

  // ---- PKCE / Cognito Hosted UI auth --------------------------------------
  function base64url(buffer) {
    return btoa(String.fromCharCode(...new Uint8Array(buffer)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function generateCodeVerifier() {
    const array = new Uint8Array(32);
    crypto.getRandomValues(array);
    return base64url(array);
  }
  async function generateCodeChallenge(verifier) {
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
    return base64url(digest);
  }

  async function loginWithProvider(provider) {
    const verifier = generateCodeVerifier();
    sessionStorage.setItem('pkce_verifier', verifier);
    const challenge = await generateCodeChallenge(verifier);
    const params = new URLSearchParams({
      client_id: CLIENT_ID, response_type: 'code', scope: 'openid email profile',
      redirect_uri: REDIRECT_URI, identity_provider: provider,
      code_challenge: challenge, code_challenge_method: 'S256',
    });
    window.location.href = `${COGNITO_DOMAIN}/oauth2/authorize?${params}`;
  }

  async function handleAuthCallback() {
    const url = new URL(window.location.href);
    const code = url.searchParams.get('code');
    if (!code) return;
    const verifier = sessionStorage.getItem('pkce_verifier');
    const resp = await fetch(`${COGNITO_DOMAIN}/oauth2/token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'authorization_code', client_id: CLIENT_ID, code,
        redirect_uri: REDIRECT_URI, code_verifier: verifier,
      }),
    });
    const tokens = await resp.json();
    localStorage.setItem('id_token', tokens.id_token);
    localStorage.setItem('access_token', tokens.access_token);
    localStorage.setItem('refresh_token', tokens.refresh_token);
    window.location.href = '/';
  }

  function decodeJwtEmail(idToken) {
    try {
      const payload = JSON.parse(atob(idToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
      return payload.email || payload['cognito:username'] || '';
    } catch { return ''; }
  }

  function refreshAuthUI() {
    const signedIn = !!localStorage.getItem('access_token');
    document.getElementById('auth-signed-out').classList.toggle('hidden', signedIn);
    document.getElementById('auth-signed-in').classList.toggle('hidden', !signedIn);
    document.getElementById('auth-signed-in').classList.toggle('flex', signedIn);
    if (signedIn) {
      const idToken = localStorage.getItem('id_token');
      document.getElementById('user-email').textContent = idToken ? decodeJwtEmail(idToken) : '';
    }
  }

  function logout() {
    localStorage.removeItem('id_token');
    localStorage.removeItem('access_token');
    localStorage.removeItem('refresh_token');
    sessionStorage.removeItem('pkce_verifier');
    history = [];
    refreshAuthUI();
    window.location.href = '/';
  }

  // ---- File attachments ----------------------------------------------------
  function formatBytes(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
  }

  function renderFileChips() {
    const box = document.getElementById('file-chips');
    box.innerHTML = '';
    box.classList.toggle('hidden', attachments.length === 0);
    attachments.forEach((file, idx) => {
      const chip = document.createElement('div');
      chip.className = 'file-chip flex items-center gap-1.5 text-xs bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-full pl-3 pr-1.5 py-1';
      chip.innerHTML = `<span class="max-w-[10rem] truncate">📄 ${file.name}</span><span class="text-slate-400">${formatBytes(file.size)}</span>`;
      const removeBtn = document.createElement('button');
      removeBtn.className = 'h-5 w-5 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center';
      removeBtn.innerHTML = '&times;';
      removeBtn.onclick = () => { attachments.splice(idx, 1); renderFileChips(); };
      chip.appendChild(removeBtn);
      box.appendChild(chip);
    });
  }

  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }

  async function handleFileSelect(fileList) {
    for (const file of Array.from(fileList)) {
      if (file.size > MAX_FILE_BYTES) {
        appendMessage('assistant', `⚠️ Skipped **${file.name}** — exceeds the ${formatBytes(MAX_FILE_BYTES)} limit.`);
        continue;
      }
      try {
        const content = await readFileAsText(file);
        attachments.push({ name: file.name, size: file.size, content });
      } catch {
        appendMessage('assistant', `⚠️ Could not read **${file.name}** as text.`);
      }
    }
    document.getElementById('file-input').value = '';
    renderFileChips();
  }

  // Drag & drop support over the chat area
  const dropOverlay = document.getElementById('drop-overlay');
  let dragCounter = 0;
  ['dragenter', 'dragover'].forEach((evt) => {
    document.body.addEventListener(evt, (e) => {
      e.preventDefault();
      dragCounter++;
      dropOverlay.classList.remove('hidden');
      dropOverlay.classList.add('flex');
    });
  });
  ['dragleave', 'drop'].forEach((evt) => {
    document.body.addEventListener(evt, (e) => {
      e.preventDefault();
      dragCounter = Math.max(0, dragCounter - 1);
      if (dragCounter === 0) {
        dropOverlay.classList.add('hidden');
        dropOverlay.classList.remove('flex');
      }
    });
  });
  document.body.addEventListener('drop', (e) => {
    if (e.dataTransfer?.files?.length) handleFileSelect(e.dataTransfer.files);
  });

  // ---- Chat ---------------------------------------------------------------
  const chatEl = () => document.querySelector('#chat > div');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }
  function handleKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  }
  function scrollToBottom() {
    const chat = document.getElementById('chat');
    chat.scrollTop = chat.scrollHeight;
  }
  function renderContent(text) {
    return marked.parse(text ?? '');
  }
  function highlightAll(container) {
    container.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));
  }

  function appendMessage(role, text, files = []) {
    document.getElementById('empty-state')?.remove();
    const wrap = document.createElement('div');
    wrap.className = `msg-enter flex items-start gap-3 ${role === 'user' ? 'justify-end' : 'justify-start'}`;

    const bubble = document.createElement('div');
    if (role === 'user') {
      bubble.className = 'max-w-[85%] sm:max-w-[75%] rounded-2xl rounded-tr-sm bg-brand-600 text-white px-4 py-2.5 text-sm sm:text-base whitespace-pre-wrap break-words';
      bubble.textContent = text;
      if (files.length) {
        const fileRow = document.createElement('div');
        fileRow.className = 'flex flex-wrap gap-1.5 mt-2';
        files.forEach((f) => {
          const tag = document.createElement('span');
          tag.className = 'text-[11px] bg-white/15 rounded-full px-2 py-0.5';
          tag.textContent = `📄 ${f.name}`;
          fileRow.appendChild(tag);
        });
        bubble.appendChild(fileRow);
      }
    } else {
      const avatar = document.createElement('div');
      avatar.className = 'h-8 w-8 shrink-0 rounded-full bg-brand-100 dark:bg-brand-900 text-brand-700 dark:text-brand-200 flex items-center justify-center text-sm font-semibold';
      avatar.textContent = '🤖';
      wrap.appendChild(avatar);

      bubble.className = 'prose-chat max-w-[85%] sm:max-w-[75%] rounded-2xl rounded-tl-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm sm:text-base prose prose-sm dark:prose-invert prose-p:my-1.5 prose-pre:my-2';
      bubble.innerHTML = renderContent(text);
      highlightAll(bubble);
    }
    wrap.appendChild(bubble);
    chatEl().appendChild(wrap);
    scrollToBottom();
    return bubble;
  }

  function setLoading(loading) {
    sendBtn.disabled = loading;
    inputEl.disabled = loading;
    document.getElementById('typing-indicator').classList.toggle('hidden', !loading);
  }

  async function send() {
    const message = inputEl.value.trim();
    if (!message && attachments.length === 0) return;

    const filesForRequest = attachments.map(({ name, content }) => ({ name, content }));
    const filesForDisplay = attachments.map(({ name, size }) => ({ name, size }));

    history.push({ role: 'user', content: message, attachments: filesForRequest });
    appendMessage('user', message || '(sent files only)', filesForDisplay);

    inputEl.value = '';
    autoResize(inputEl);
    attachments = [];
    renderFileChips();
    setLoading(true);

    try {
      const resp = await fetch(LAMBDA_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${localStorage.getItem('access_token')}`,
        },
        body: JSON.stringify({
          message,
          history: history.slice(0, -1),
          attachments: filesForRequest,
        }),
      });
      const result = await resp.json();
      const reply = result.result ?? result.error ?? 'No response from agent.';
      history.push({ role: 'assistant', content: reply });
      appendMessage('assistant', reply);
    } catch (err) {
      appendMessage('assistant', `⚠️ Request failed: ${err.message}`);
    } finally {
      setLoading(false);
      inputEl.focus();
    }
  }

  // ---- Init ----------------------------------------------------------------
  window.addEventListener('DOMContentLoaded', async () => {
    if (window.location.pathname === '/callback' || new URL(window.location.href).searchParams.get('code')) {
      await handleAuthCallback();
    }
    refreshAuthUI();
    inputEl.focus();
  });
</script>
</body>
</html>
