services:
  postgres-test:
    image: postgres:13
    environment:
      POSTGRES_DB: coding_agent_test
      POSTGRES_USER: coding_agent_test
      POSTGRES_PASSWORD: d0-test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coding_agent_test -d coding_agent_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  mongo-test:
    image: mongo:8.0
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.runCommand({ping:1}).ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
  backend-tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      D0_TEST_SANDBOX: "1"
      TEST_DATABASE_URL: postgresql+psycopg://coding_agent_test:d0-test-only-password@postgres-test:5432/coding_agent_test
      TEST_MONGODB_URI: mongodb://mongo-test:27017/
      TEST_MONGODB_DATABASE: coding_agent_test
    depends_on:
      postgres-test:
        condition: service_healthy
      mongo-test:
        condition: service_healthy
networks:
  default:
    internal: true
