AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Perplexity-style web app backend (Lambda + response streaming + EC2 auto-start + repo tools + front-end hosting)"


Parameters:
  VllmEndpoint:
    Type: String
    Description: Private HTTP endpoint of the vLLM server on the T4 EC2 instance
  UserPoolId:
    Type: String
  TavilyApiKey:
    Type: String
    NoEcho: true
  SubnetId:
    Type: String
  SecurityGroupId:
    Type: String
  Ec2InstanceId:
    Type: String
    Description: Instance ID of the T4 EC2 host running vLLM
  GitHubToken:
    Type: String
    NoEcho: true
    Description: GitHub personal access token (repo scope) for branch/PR/issue tools
  GitLabToken:
    Type: String
    NoEcho: true
    Description: GitLab personal/project access token (api scope) for branch/MR/issue tools
  GitHubOAuthClientId:
    Type: String
    Description: GitHub OAuth App client ID used for per-user "Connect GitHub" authorization
  GitHubOAuthClientSecret:
    Type: String
    NoEcho: true
    Description: GitHub OAuth App client secret (server-side code-for-token exchange only)
  DomainName:
    Type: String
    Default: ""
    Description: >-
      Optional custom domain for the front-end (e.g. agent.example.com), already
      registered in Route 53. Leave blank to use the default *.cloudfront.net domain.
  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Route 53 hosted zone ID that owns DomainName. Required only if DomainName is set;
      used to auto-validate the ACM certificate and create the DNS alias record.


Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]


Resources:
  PendingActionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: pending-actions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: action_id
          AttributeType: S
      KeySchema:
        - AttributeName: action_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true


  UserIntegrationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: user-integrations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: provider
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: provider
          KeyType: RANGE


  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: perplexity-clone-chat
      Runtime: python3.12
      Handler: lambda_function.handler
      Timeout: 180
      MemorySize: 512
      Environment:
        Variables:
          VLLM_ENDPOINT: !Ref VllmEndpoint
          MODEL_NAME: Qwen/Qwen3-Coder-14B-Instruct-AWQ
          USER_POOL_ID: !Ref UserPoolId
          TAVILY_API_KEY: !Ref TavilyApiKey
          EC2_INSTANCE_ID: !Ref Ec2InstanceId
          STARTUP_BUDGET_S: "120"
          GITHUB_TOKEN: !Ref GitHubToken
          GITLAB_TOKEN: !Ref GitLabToken
          GITHUB_OAUTH_CLIENT_ID: !Ref GitHubOAuthClientId
          GITHUB_OAUTH_CLIENT_SECRET: !Ref GitHubOAuthClientSecret
          USER_INTEGRATIONS_TABLE: !Ref UserIntegrationsTable
      VpcConfig:
        SubnetIds:
          - !Ref SubnetId
        SecurityGroupIds:
          - !Ref SecurityGroupId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PendingActionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserIntegrationsTable
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:StartInstances
              Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Ec2InstanceId}"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: ["POST"]
          AllowHeaders: ["authorization", "content-type"]


  # ---------------------------------------------------------------------
  # Front-end static hosting: private S3 bucket behind CloudFront using
  # Origin Access Control (OAC), so the bucket itself is never public.
  # CustomErrorResponses map 403/404 back to /index.html so client-side
  # routes (/callback, /callback/github, /callback/gitlab) resolve to the
  # single-page app instead of returning a raw S3 error.
  #
  # Custom domain (optional): if DomainName + HostedZoneId are supplied,
  # an ACM certificate is issued and DNS-validated automatically against
  # the existing Route 53 hosted zone (no manual steps), and a Route 53
  # alias record points the domain at this distribution. HTTPS is
  # enforced (ViewerProtocolPolicy: redirect-to-https) for both the
  # default *.cloudfront.net domain and any custom domain — ACM
  # certificates are free, so there is no reason not to use one.
  # ---------------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "coding-agent-frontend-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} front-end (index.html + app.js + config.js)"
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref FrontendCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref "AWS::NoValue"
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: ["GET", "HEAD"]
          CachedMethods: ["GET", "HEAD"]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # AWS Managed-CachingOptimized
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  FrontendDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # fixed, global CloudFront hosted zone ID


Outputs:
  FunctionUrl:
    Value: !GetAtt ChatFunctionUrl.FunctionUrl
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
  FrontendCloudFrontDomain:
    Description: Always-available *.cloudfront.net domain, regardless of custom domain
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  FrontendUrl:
    Description: Preferred front-end URL (custom domain if configured, else CloudFront domain)
    Value: !If [HasCustomDomain, !Sub "https://${DomainName}", !Sub "https://${FrontendDistribution.DomainName}"]
