name: Deploy Coding Agent Stack [FINAL]

on:
  push:
    branches:
      - main
    paths:
      - 'lambda_function.py'
      - 'repo_tools.py'
      - 'template.yaml'
      - 'front-end/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  STACK_NAME: coding-agent-stack

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest flake8
      - name: Lint
        run: flake8 lambda_function.py cli_agent.py cli_auth.py repo_tools.py --max-line-length=120 --extend-ignore=E203
      - name: Run unit tests
        run: |
          if [ -d tests ]; then pytest tests/ -v; else echo "No tests directory found, skipping"; fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aws-sam-cli
      - run: sam build --use-container
      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --capabilities CAPABILITY_IAM \
            --region ${{ env.AWS_REGION }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides \
              VllmEndpoint=${{ secrets.VLLM_ENDPOINT }} \
              UserPoolId=${{ secrets.COGNITO_USER_POOL_ID }} \
              TavilyApiKey=${{ secrets.TAVILY_API_KEY }} \
              SubnetId=${{ secrets.VPC_SUBNET_ID }} \
              SecurityGroupId=${{ secrets.VPC_SECURITY_GROUP_ID }} \
              Ec2InstanceId=${{ secrets.EC2_INSTANCE_ID }} \
              GitHubToken=${{ secrets.GITHUB_TOKEN }} \
              GitLabToken=${{ secrets.GITLAB_TOKEN }} \
              GitHubOAuthClientId=${{ secrets.GITHUB_OAUTH_CLIENT_ID }} \
              GitHubOAuthClientSecret=${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
      - name: Get Function URL
        id: get_url
        run: |
          FUNCTION_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue" \
            --output text)
          echo "$FUNCTION_URL"
          echo "function_url=$FUNCTION_URL" >> "$GITHUB_OUTPUT"
    outputs:
      function_url: ${{ steps.get_url.outputs.function_url }}

  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve stack outputs
        id: stack
        run: |
          FUNCTION_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue" \
            --output text)
          echo "function_url=$FUNCTION_URL" >> "$GITHUB_OUTPUT"
      - name: Inject runtime config
        run: |
          sed -i "s|__LAMBDA_FUNCTION_URL__|${{ steps.stack.outputs.function_url }}|g" front-end/config.js
          sed -i "s|__COGNITO_DOMAIN__|${{ secrets.COGNITO_DOMAIN }}|g" front-end/config.js
          sed -i "s|__COGNITO_CLIENT_ID__|${{ secrets.COGNITO_CLIENT_ID }}|g" front-end/config.js
          sed -i "s|__GITHUB_OAUTH_CLIENT_ID__|${{ secrets.GITHUB_OAUTH_CLIENT_ID }}|g" front-end/config.js
          sed -i "s|__GITLAB_OAUTH_CLIENT_ID__|${{ secrets.GITLAB_OAUTH_CLIENT_ID }}|g" front-end/config.js
      - name: Sync to S3
        run: |
          aws s3 sync front-end/ s3://${{ secrets.FRONTEND_BUCKET }}/ --delete
      - name: Invalidate CloudFront
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
