name: FastAPI Tests
on:
  push:
    paths:
      - "back-end/fast-api/**"
      - ".github/workflows/fastapi-tests.yml"
      - ".gitlab-ci.yml"
  pull_request:
    paths:
      - "back-end/fast-api/**"
      - ".github/workflows/fastapi-tests.yml"
      - ".gitlab-ci.yml"
permissions:
  contents: read
jobs:
  test-fastapi:
    name: FastAPI disposable integration tests
    runs-on: ubuntu-latest
    container: python:3.12-slim
    env:
      D0_TEST_SANDBOX: "1"
      TEST_DATABASE_URL: postgresql+psycopg://coding_agent_test:d0-test-only-password@postgres-test:5432/coding_agent_test
      TEST_MONGODB_URI: mongodb://mongo-test:27017/
      TEST_MONGODB_DATABASE: coding_agent_test
    services:
      postgres-test:
        image: postgres:13
        env:
          POSTGRES_DB: coding_agent_test
          POSTGRES_USER: coding_agent_test
          POSTGRES_PASSWORD: d0-test-only-password
      mongo-test:
        image: mongo:8.0
    defaults:
      run:
        working-directory: back-end/fast-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test safety policy
        run: python -m unittest discover -s tests_support -p 'test_*.py' -v
      - name: Guard, migrate, and test disposable services
        run: python -m tests_support.run_backend_suite
