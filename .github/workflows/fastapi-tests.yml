name: FastAPI Tests

on:
  push:
    paths:
      - "back-end/fast-api/**"
      - ".github/workflows/fastapi-tests.yml"
      - ".gitlab-ci.yml"
  pull_request:
    paths:
      - "back-end/fast-api/**"
      - ".github/workflows/fastapi-tests.yml"
      - ".gitlab-ci.yml"

permissions:
  contents: read

jobs:
  test-fastapi:
    name: FastAPI unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back-end/fast-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            back-end/fast-api/requirements.txt
            back-end/fast-api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run FastAPI tests
        run: |
          export INTEGRATION_TOKEN_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python -m pytest -q tests
